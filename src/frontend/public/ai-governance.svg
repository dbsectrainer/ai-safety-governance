<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Grid -->
  <path d="M0 0h500v400H0z" fill="#f8f9fa"/>
  <path d="M50 50h400v300H50z" fill="#e9ecef"/>
  
  <!-- Connected Nodes Representing AI Network -->
  <circle cx="150" cy="150" r="20" fill="#4dabf7"/>
  <circle cx="250" cy="100" r="20" fill="#4dabf7"/>
  <circle cx="350" cy="150" r="20" fill="#4dabf7"/>
  <circle cx="150" cy="250" r="20" fill="#4dabf7"/>
  <circle cx="250" cy="300" r="20" fill="#4dabf7"/>
  <circle cx="350" cy="250" r="20" fill="#4dabf7"/>
  
  <!-- Connection Lines -->
  <line x1="150" y1="150" x2="250" y2="100" stroke="#4dabf7" stroke-width="2"/>
  <line x1="250" y1="100" x2="350" y2="150" stroke="#4dabf7" stroke-width="2"/>
  <line x1="150" y1="250" x2="150" y2="150" stroke="#4dabf7" stroke-width="2"/>
  <line x1="350" y1="250" x2="350" y2="150" stroke="#4dabf7" stroke-width="2"/>
  <line x1="150" y1="250" x2="250" y2="300" stroke="#4dabf7" stroke-width="2"/>
  <line x1="250" y1="300" x2="350" y2="250" stroke="#4dabf7" stroke-width="2"/>
  
  <!-- Shield Overlay -->
  <path d="M250 75 L350 125 L350 275 L250 325 L150 275 L150 125 Z" 
        fill="none" 
        stroke="#1864ab" 
        stroke-width="4"
        stroke-dasharray="10,5"/>
        
  <!-- Safety Check Marks -->
  <circle cx="200" cy="175" r="15" fill="#40c057"/>
  <path d="M190 175 L197 182 L210 169" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <circle cx="300" cy="175" r="15" fill="#40c057"/>
  <path d="M290 175 L297 182 L310 169" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <circle cx="250" cy="225" r="15" fill="#40c057"/>
  <path d="M240 225 L247 232 L260 219" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
