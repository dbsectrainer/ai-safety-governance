name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint API and core
        run: |
          flake8 src/api src/database src/main.py src/scripts src/utils \
            src/compliance/checks.py src/compliance/regulatory_alignment.py
          black --check src/api src/database src/main.py src/scripts src/utils \
            src/compliance/checks.py src/compliance/regulatory_alignment.py
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src/api --cov=src/database --cov=src/main.py \
            --cov=src/compliance --cov=src/utils \
            --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 14

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: src/frontend
        env:
          CI: 'true'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: docs/evidence
          retention-days: 14
