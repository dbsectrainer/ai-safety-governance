apiVersion: v1
kind: Service
metadata:
  name: ai-safety-governance
  namespace: ai-safety
  labels:
    app: ai-safety-governance
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: ai-safety-governance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-safety-service-account
  namespace: ai-safety
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/ai-safety-governance-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-safety-governance-role
  namespace: ai-safety
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-safety-governance-role-binding
  namespace: ai-safety
subjects:
  - kind: ServiceAccount
    name: ai-safety-service-account
    namespace: ai-safety
roleRef:
  kind: Role
  name: ai-safety-governance-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ai-safety-governance-cert
  namespace: ai-safety
spec:
  secretName: ai-safety-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - AI Safety Governance
  commonName: ai-safety-governance.example.com
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - ai-safety-governance.example.com
    - ai-safety-governance.ai-safety.svc.cluster.local
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-safety-governance-ingress
  namespace: ai-safety
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    nginx.ingress.kubernetes.io/server-snippet: |
      location / {
        deny all;
        auth_request /auth;
        error_page 401 = /login;
      }
spec:
  tls:
    - hosts:
        - ai-safety-governance.example.com
      secretName: ai-safety-tls
  rules:
    - host: ai-safety-governance.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-safety-governance
                port:
                  name: http
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: ai-safety-governance
                port:
                  name: metrics
---
apiVersion: policy/v1
kind: PodSecurityPolicy
metadata:
  name: ai-safety-governance-psp
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: "runtime/default"
    seccomp.security.alpha.kubernetes.io/defaultProfileName: "runtime/default"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - "configMap"
    - "emptyDir"
    - "projected"
    - "secret"
    - "downwardAPI"
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: "MustRunAsNonRoot"
  seLinux:
    rule: "RunAsAny"
  supplementalGroups:
    rule: "MustRunAs"
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: "MustRunAs"
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true
  allowedHostPaths: []
