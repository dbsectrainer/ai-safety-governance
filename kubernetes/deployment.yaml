apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-safety-governance
  namespace: ai-safety
  labels:
    app: ai-safety-governance
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-safety-governance
  template:
    metadata:
      labels:
        app: ai-safety-governance
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-safety-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: ai-safety-governance
          image: ${ECR_REGISTRY}/ai-safety-governance:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
          envFrom:
            - secretRef:
                name: ai-safety-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: certs
              mountPath: /app/certs
              readOnly: true
            - name: logs
              mountPath: /app/compliance_logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: ai-safety-config
        - name: certs
          secret:
            secretName: ai-safety-certs
        - name: logs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ai-safety-governance
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ai-safety-governance
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ai-safety"
          effect: "NoSchedule"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-safety-governance-pdb
  namespace: ai-safety
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ai-safety-governance
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-safety-governance-hpa
  namespace: ai-safety
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-safety-governance
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-safety-governance-network-policy
  namespace: ai-safety
spec:
  podSelector:
    matchLabels:
      app: ai-safety-governance
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              name: logging
      ports:
        - protocol: TCP
          port: 24224
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-safety-governance-monitor
  namespace: ai-safety
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: ai-safety-governance
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
