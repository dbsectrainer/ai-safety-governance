name: AI Safety & Governance CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: ai-safety-governance
  EKS_CLUSTER: ai-safety-cluster
  KUBE_NAMESPACE: ai-safety

jobs:
  documentation-workflow:
    name: Documentation Generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install networkx matplotlib markdown2 pygments

      - name: Generate Documentation
        run: |
          python -m src.documentation_generator.documentation_workflow

      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      - name: Archive Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ./docs
          retention-days: 30

  # Existing jobs remain unchanged
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run SAST Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check@main
        with:
          project: "AI Safety & Governance"
          path: "."
          format: "HTML"

      - name: Run Container Scan
        uses: azure/container-scan@v0
        with:
          image-name: ${{ env.ECR_REPOSITORY }}

      - name: Run Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  # Rest of the existing pipeline remains the same...
  compliance-test:
    name: Compliance Testing
    runs-on: ubuntu-24.04
    needs:
      - security-scan
      - documentation-workflow
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit safety

      - name: Run GDPR Compliance Tests
        run: pytest tests/compliance/test_gdpr.py

      - name: Run HIPAA Compliance Tests
        run: pytest tests/compliance/test_hipaa.py

      - name: Run Security Policy Tests
        run: pytest tests/security/test_security_policies.py

      - name: Run Privacy Tests
        run: pytest tests/security/test_privacy.py

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    needs: compliance-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Unit Tests
        run: |
          pytest tests/ --cov=src/ --cov-report=xml

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ --cov=src/ --cov-report=xml

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} ${{ env.ECR_REPOSITORY }}:latest

  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Run Security Audit
        run: |
          safety check
          bandit -r src/

      - name: Run Container Security Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: security-audit
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EKS Staging
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
          kubectl apply -f kubernetes/staging/

      - name: Run Security Tests in Staging
        run: |
          pytest tests/security/ --staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EKS Production
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
          kubectl apply -f kubernetes/production/

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/ai-safety-governance -n ${{ env.KUBE_NAMESPACE }}

      - name: Run Production Security Scan
        run: |
          pytest tests/security/ --production

  monitoring:
    name: Setup Monitoring
    runs-on: ubuntu-24.04
    needs: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Prometheus
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values devops/monitoring/prometheus_config.yaml

      - name: Configure Alerts
        run: |
          kubectl apply -f devops/monitoring/alerts/

      - name: Setup Logging
        run: |
          kubectl apply -f devops/logging/

  compliance-audit:
    name: Compliance Audit
    runs-on: ubuntu-24.04
    needs: monitoring
    steps:
      - name: Run Compliance Checks
        run: |
          pytest tests/compliance/ --production

      - name: Generate Compliance Report
        run: |
          python scripts/generate_compliance_report.py

      - name: Archive Compliance Report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: reports/compliance/

  cleanup:
    name: Cleanup
    runs-on: ubuntu-24.04
    needs: compliance-audit
    if: always()
    steps:
      - name: Cleanup Old Images
        run: |
          aws ecr batch-delete-image \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids "$(aws ecr list-images \
              --repository-name ${{ env.ECR_REPOSITORY }} \
              --filter tagStatus=UNTAGGED \
              --query 'imageIds[*]' \
              --output json)"

      - name: Cleanup Test Resources
        run: |
          kubectl delete -f kubernetes/test/ || true
