apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: monitoring
spec:
  serviceAccountName: prometheus
  serviceMonitorSelector:
    matchLabels:
      team: ai-safety
  resources:
    requests:
      memory: 400Mi
  enableAdminAPI: false
  additionalScrapeConfigs:
    name: additional-scrape-configs
    key: prometheus-additional.yaml
  externalLabels:
    cluster: ai-safety-eks
  remoteWrite:
    - url: "http://prometheus-server/api/v1/write"
      writeRelabelConfigs:
        - sourceLabels: [__name__]
          regex: '{__name__=~"instance:.+"}'
          action: keep
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: gp2
        resources:
          requests:
            storage: 40Gi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-safety-monitor
  namespace: monitoring
  labels:
    team: ai-safety
spec:
  selector:
    matchLabels:
      app: ai-safety-governance
  endpoints:
  - port: metrics
    interval: 15s
  namespaceSelector:
    matchNames:
    - default
