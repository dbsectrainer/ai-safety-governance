global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ai-safety-governance'
    static_configs:
      - targets: ['localhost:5000']

  - job_name: 'model-monitoring'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

rule_files:
  - 'alert_rules.yml'
